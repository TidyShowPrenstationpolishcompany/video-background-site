<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Background Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .background-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    }

    .content {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      text-align: center;
      background-color: rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 3rem;
    }

    p {
      font-size: 1.5rem;
      max-width: 600px;
    }
  </style>
</head>
<body>
  <video class="background-video" autoplay muted loop>
    <source src="mycoolvideo.mp4.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>

  <div class="content">
    <h1>Welcome</h1>
    <p>This page has a fully online video background.</p>
  </div>
</body>
</html>
